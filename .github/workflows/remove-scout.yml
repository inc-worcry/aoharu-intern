name: Remove /scout/ from Xserver (one-off)
on:
  workflow_dispatch:
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Delete scout directory
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 3
          set net:timeout 60
          cls -la /worcry.com/public_html/aoharu-intern.worcry.com/scout/
          rm -r -f /worcry.com/public_html/aoharu-intern.worcry.com/scout/
          cls -1 /worcry.com/public_html/aoharu-intern.worcry.com/
          bye
          EOF
