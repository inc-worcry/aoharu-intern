name: Inspect worcry.com public_html (read-only)

# 読み取り専用の確認。worcry.com の公開フォルダに、HPと同じ名前のファイル/フォルダが既にあるかを調べる。
# 中身の一覧はログに出さず、各ジョブの成功/失敗だけで結果を返す（失敗＝その名前が既にある）。
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-worcry-root.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [".htaccess", "404.html", "about", "message", "member", "company", "news", "contact", "privacy-policy", "kiyaku", "kiyaku-salon", "kiyaku-scl", "assets", "img", "favicon.svg", "robots.txt", "sitemap.xml", "index.html", ".ftp-deploy-sync-state.json"]
    name: exists? ${{ matrix.name }}
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
      - name: Check (fails if the name already exists)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TARGET: ${{ matrix.name }}
        run: |
          lftp -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set net:max-retries 2; set net:timeout 30; cls -1a /worcry.com/public_html/ > /tmp/list.txt; bye" -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" > /dev/null 2>&1
          test -s /tmp/list.txt || { echo "listing failed"; exit 2; }
          sed -i 's#/$##; s#.*/##' /tmp/list.txt
          if grep -qxF "$TARGET" /tmp/list.txt; then echo "EXISTS"; exit 1; else echo "not found"; fi
