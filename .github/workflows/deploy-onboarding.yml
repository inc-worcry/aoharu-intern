name: Deploy onboarding to Xserver (FTP)

on:
  push:
    branches: [ main ]
    paths:
      - 'onboarding/**'
      - '.github/workflows/deploy-onboarding.yml'
  workflow_dispatch:

jobs:
  onboarding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy to Xserver
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 180000
          local-dir: ./onboarding/
          server-dir: /worcry.com/public_html/aoharu-intern.worcry.com/onboarding/
