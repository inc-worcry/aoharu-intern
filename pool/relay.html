<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="robots" content="noindex, nofollow"><title>pool relay</title></head>
<body>
<!-- 旧URL（inc-worcry.github.io/aoharu-intern/pool/）のフォーム送信を、aoharu-intern.com 上で中継するページ。
     旧URLのドメインでは新卒シート側のスパム判定（reCAPTCHA）を通らないため、ここで reCAPTCHA を取り直して送る。2026-11 -->
<script>
(function(){
  var K='6LfHOhYuAAAAAAkmORWx4rw0Bo4Qwnt2X2vIbGq7', t0=Date.now();
  var GAS="https://script.google.com/macros/s/AKfycbz3Nbd8CtPb25Pni3nogrKiSbIRdEZNliIpOsPMNPgrHfso7cCbshO5n0V1V3ACu0mm/exec", MAIL="https://script.google.com/macros/s/AKfycby7F4UHGQUIdw8zHdrUyAns1gb_0n-bi04r3cjCM3TVlSfyUJ8qRiqQGRqrX2ZaI-RK9Q/exec";
  var ALLOWED=['https://inc-worcry.github.io','https://aoharu-intern.worcry.com'];
  var s=document.createElement('script'); s.src='https://www.google.com/recaptcha/api.js?render='+K; s.async=true; document.head.appendChild(s);
  function token(){
    return new Promise(function(res){
      if(!window.grecaptcha||!grecaptcha.ready) return res('');
      var done=false, tm=setTimeout(function(){ if(!done){done=true;res('');} },4000);
      grecaptcha.ready(function(){
        grecaptcha.execute(K,{action:'contact'}).then(function(t){ if(done)return; done=true; clearTimeout(tm); res(t); },
          function(){ if(!done){done=true;clearTimeout(tm);res('');} });
      });
    });
  }
  window.addEventListener('message',function(e){
    if(ALLOWED.indexOf(e.origin)<0) return;
    var m=e.data; if(!m||m.type!=='pool-submit'||!m.data) return;
    var d=m.data;
    token().then(function(t){
      d['g-recaptcha-response']=t;
      if(!d._e) d._e=String(Date.now()-t0);
      d.relay='aoharu-intern.com/pool/relay.html';
      var body=JSON.stringify(d);
      try{fetch(GAS,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body});}catch(err){}
      try{fetch(MAIL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body});}catch(err){}
      e.source.postMessage({type:'pool-sent',id:m.id},e.origin);
    });
  });
  if(window.parent!==window) window.parent.postMessage({type:'pool-relay-ready'},'*');
})();
</script>
</body></html>
